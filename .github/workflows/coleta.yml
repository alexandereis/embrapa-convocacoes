name: Coleta e Deploy

# Gatilhos:
#  - repository_dispatch "fonte-mudou": disparado pelo Cloudflare Worker (que
#    fica lendo o Looker a cada 1 min) SO quando a fonte muda de verdade. E o
#    caminho rapido e limpo (o Actions so roda quando ha novidade real).
#  - schedule: rede de seguranca a cada 6h, caso o Worker esteja fora do ar.
#  - workflow_dispatch / push: disparo manual e em mudanca de codigo.
# O coletor (collect.py) so regrava/commita o data.json quando ha mudanca real.
on:
  repository_dispatch:
    types: [fonte-mudou]
  schedule:
    - cron: "7 */6 * * *"    # coleta: rede de seguranca a cada 6h (UTC)
    - cron: "23 */12 * * *"  # deploy GARANTIDO a cada 12h (mesmo sem mudanca)
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "site/**", "collector/**", ".github/workflows/**" ]

permissions:
  contents: write   # para commitar o data.json atualizado
  pages: write      # para publicar no GitHub Pages
  id-token: write

concurrency:
  group: "coleta-pages"
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historico completo (necessario p/ rebase no push)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # So em mudanca de codigo/disparo manual: uma coleta agendada nunca pode
      # ficar bloqueada por teste -- o painel ficaria velho por isso.
      - name: Testes do coletor
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s collector -t collector -p "test_*.py" -v

      - name: Coletar dados (recalcula metricas)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # eleva o rate limit da API
        run: python collector/collect.py

      - name: Commitar dados se mudaram
        id: dados
        run: |
          git config user.name "embrapa-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          # data.json + estado da timeline (a serie temporal propria cresce a
          # cada coleta). O seed e o catalogo sao versionados manualmente.
          git add site/data/data.json site/data/timeline_state.json 2>/dev/null || true
          CHANGED=false; SO_ESTADO=false
          if git diff --cached --quiet; then
            echo "Sem mudancas nos dados."
          else
            # So o data.json muda o que o visitante ve. O timeline_state.json
            # pode mudar sozinho (ex.: contador da guarda de fonte desatualizada)
            # -- isso a gente commita, mas nao republica o site a toa.
            if git diff --cached --quiet -- site/data/data.json; then
              echo "Só o estado interno mudou -> commit sem deploy."
              SO_ESTADO=true
            fi
            # [skip ci] impede que este commit re-dispare o workflow.
            git commit -m "chore(dados): atualizacao automatica $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            # push resiliente: se o remoto avancou, rebaseia e tenta de novo.
            PUSHED=false
            for i in 1 2 3 4 5; do
              if git push; then echo "push ok"; PUSHED=true; break; fi
              echo "push rejeitado (tentativa $i) — rebaseando no remoto..."
              git pull --rebase -X theirs origin main || git rebase --abort
              sleep 3
            done
            if [ "$PUSHED" != "true" ]; then
              echo "Falha ao empurrar apos varias tentativas."; exit 1
            fi
            [ "$SO_ESTADO" = "true" ] || CHANGED=true
          fi
          # So publica no Pages quando ha novidade real (evita deploys de
          # conteudo identico, que causam "Deployment failed, try again later"),
          # ou quando e mudanca de codigo (push) / disparo manual.
          if [ "$CHANGED" = "true" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "23 */12 * * *" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Nada mudou -> sem deploy nesta execucao."
          fi

      - name: Configurar Pages
        if: steps.dados.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload do site
        if: steps.dados.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy no GitHub Pages
        id: deployment
        if: steps.dados.outputs.deploy == 'true'
        continue-on-error: true       # se o Pages engasgar, tenta de novo abaixo
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000             # 5 min/tentativa (deploy de artefato e rapido)

      - name: Deploy no GitHub Pages (2a tentativa)
        id: deployment2
        if: steps.dados.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000             # 10 min na tentativa final
